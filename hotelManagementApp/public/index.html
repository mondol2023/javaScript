<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>
    <link reel="stylesheet" href="style.css">
</head>
<body>

    <h2>hotel management System</h2>

    <main>
        <section id = "login-Form">
            <h2>Login</h2>
            <form id="loginform">
                <label for="username">Username: </label>
                <input type="text" id="username" placeholder="Username" required>
                <label for="password">Password: </label>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </section>
    
       <!----<h2>Register</h2>
        <form id="register-form">
            <input type="text" id="name" placeholder="Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>//   -->
    
        <section id = "bookingForm">
            <h2>Booking a room </h2>
            <form id = "roomForm">
                <label for ="name">Name: </label>
                <input type= "text" id="name" required>
                <label for ="roomType">room type: </label>
                
                <select id="roomType" required>
                    <option value="Single" >Single -600//- </option>
                    <option value="Double" >Double -1000//- </option>
                    <option value="Suite" >Suite -2000//- </option>
                </select>
                <label for ="nights">Nights: </label>
                <input type= "number" id="nights" min ="1" required>
                <button type="submit">Book Now</button>
            </form>
        </section>
    
    
        <section id = "admin-dashboard" style="display: none">
            <h2>Admin Dashboard</h2>
            <button id = "viewBookings">View All</button>
            <ul id="adminBookingList"></ul>
        </section>
    </main>


    <script src="scripts.js"></script>
</body>
</html>
